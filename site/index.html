<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Reader</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
    --accent: #2f6fde; --accent-soft: #e8effc; --read: #9a9aa0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31;
      --accent: #6d9bff; --accent-soft: #1f2a40; --read: #6a6a72;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 20px 12px; position: sticky; top: 0;
          height: 100vh; overflow-y: auto; background: var(--panel); }
  aside h1 { font-size: 16px; margin: 0 8px 16px; }
  .src { display: flex; justify-content: space-between; width: 100%; border: 0; background: none;
         color: var(--text); padding: 7px 10px; border-radius: 7px; cursor: pointer; font: inherit; text-align: left; }
  .src:hover { background: var(--bg); }
  .src.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .src .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .src.active .n { color: var(--accent); }
  .side-actions { margin-top: 20px; display: grid; gap: 8px; padding: 0 4px; }
  button.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text);
               padding: 7px 12px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 13px; }
  button.btn:hover { border-color: var(--accent); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .status { font-size: 12px; color: var(--muted); padding: 4px; min-height: 18px; }
  main { padding: 20px 28px; max-width: 900px; width: 100%; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .toolbar input, .toolbar select { font: inherit; padding: 8px 12px; border: 1px solid var(--line);
               border-radius: 8px; background: var(--panel); color: var(--text); }
  .toolbar input { flex: 1; min-width: 200px; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 7px;
         cursor: pointer; font: inherit; }
  .tab.active { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .meta-line { color: var(--muted); font-size: 13px; margin: 6px 0 14px; display: flex; justify-content: space-between; }
  .meta-line a { color: var(--accent); cursor: pointer; }
  .post { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px; }
  .post .body { flex: 1; min-width: 0; }
  .post .top { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .post .co { color: var(--accent); font-weight: 600; }
  .post a.title { display: block; color: var(--text); font-weight: 600; font-size: 16px;
                  text-decoration: none; margin: 3px 0; overflow-wrap: anywhere; }
  .post a.title:hover { color: var(--accent); }
  .post p { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .post.read a.title { color: var(--read); font-weight: 500; }
  .icons { display: flex; flex-direction: column; gap: 4px; }
  .icon { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px;
          width: 30px; height: 30px; border-radius: 6px; }
  .icon:hover { background: var(--bg); color: var(--text); }
  .icon.on { color: #e3a008; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  #more { display: block; margin: 16px auto 40px; }
  .menu-btn { display: none; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 30% 0 0; z-index: 10; transform: translateX(-100%);
            transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.2); }
    aside.open { transform: none; }
    main { padding: 16px; }
    .menu-btn { display: inline-block; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>Engineering Reader</h1>
    <div id="sources"></div>
    <div class="side-actions">
      <div class="status" id="status">Loading posts…</div>
      <a class="status" href="https://github.com/chowpawan/eng-blog-reader">Source on GitHub</a>
    </div>
  </aside>
  <main>
    <div class="toolbar">
      <button class="btn menu-btn" id="menu">☰</button>
      <input id="q" type="search" placeholder="Search titles, summaries, authors…">
      <select id="year"><option value="">All years</option></select>
      <div class="tabs">
        <button class="tab active" data-f="">All</button>
        <button class="tab" data-f="unread">Unread</button>
        <button class="tab" data-f="saved">Saved</button>
      </div>
    </div>
    <div class="meta-line"><span id="count"></span><a id="markall">Mark all as read</a></div>
    <div id="list"></div>
    <button class="btn" id="more" hidden>Load more</button>
  </main>
</div>
<script>
const state = { source: "", filter: "", q: "", year: "", shown: 0 };
const names = {};
let sources = [], posts = [], matches = [];
const $ = id => document.getElementById(id);
const esc = s => (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Read/saved state lives in this browser only.
function loadSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); } catch { return new Set(); } }
function saveSet(key, set) { try { localStorage.setItem(key, JSON.stringify([...set])); } catch {} }
const read = loadSet("read"), saved = loadSet("saved");

function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function renderSources() {
  const stats = {};
  for (const p of posts) {
    const s = stats[p.s] || (stats[p.s] = { total: 0, unread: 0, oldest: p.p });
    s.total++; if (!read.has(p.u)) s.unread++;
    if (p.p && (!s.oldest || p.p < s.oldest)) s.oldest = p.p;
  }
  const all = { total: posts.length, unread: posts.filter(p => !read.has(p.u)).length };
  const btn = (id, name, s = {}) => `<button class="src ${state.source === id ? "active" : ""}" data-id="${id}"
      title="${s.oldest ? "Back to " + fmtDate(s.oldest) : ""}">
      <span>${esc(name)}</span><span class="n">${s.unread ? s.unread + " / " : ""}${s.total || 0}</span></button>`;
  $("sources").innerHTML = btn("", "All companies", all) + sources.map(s => btn(s.id, s.name, stats[s.id])).join("");
}

function postHTML(p) {
  const isRead = read.has(p.u), isSaved = saved.has(p.u);
  return `<div class="post ${isRead ? "read" : ""}" data-url="${esc(p.u)}">
    <div class="body">
      <div class="top"><span class="co">${esc(names[p.s] || p.s)}</span>
        <span>${fmtDate(p.p)}</span>${p.a ? `<span>· ${esc(p.a)}</span>` : ""}</div>
      <a class="title" href="${esc(p.u)}" target="_blank" rel="noopener">${esc(p.t)}</a>
      ${p.d ? `<p>${esc(p.d)}</p>` : ""}
    </div>
    <div class="icons">
      <button class="icon ${isSaved ? "on" : ""}" data-act="saved" title="Save for later">${isSaved ? "★" : "☆"}</button>
      <button class="icon" data-act="read" title="Toggle read">${isRead ? "●" : "○"}</button>
    </div></div>`;
}

function filterPosts() {
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  matches = posts.filter(p =>
    (!state.source || p.s === state.source) &&
    (!state.year || (p.p || "").startsWith(state.year)) &&
    (state.filter !== "unread" || !read.has(p.u)) &&
    (state.filter !== "saved" || saved.has(p.u)) &&
    terms.every(t => p._text.includes(t)));
}

function renderPosts(append = false) {
  if (!append) { filterPosts(); state.shown = 0; }
  const page = matches.slice(state.shown, state.shown + 50);
  const html = page.map(postHTML).join("");
  if (append) $("list").insertAdjacentHTML("beforeend", html);
  else $("list").innerHTML = html || `<div class="empty">No posts match.</div>`;
  state.shown += page.length;
  $("count").textContent = `${matches.length.toLocaleString()} posts`;
  $("more").hidden = state.shown >= matches.length;
}

function mark(el, field, value) {
  const url = el.dataset.url, set = field === "read" ? read : saved;
  value ? set.add(url) : set.delete(url);
  saveSet(field, set);
  if (field === "read") {
    el.classList.toggle("read", value);
    el.querySelector('[data-act="read"]').textContent = value ? "●" : "○";
  } else {
    const b = el.querySelector('[data-act="saved"]');
    b.classList.toggle("on", value); b.textContent = value ? "★" : "☆";
  }
  renderSources();
}

$("list").addEventListener("click", e => {
  const post = e.target.closest(".post");
  if (!post) return;
  if (e.target.matches("a.title")) mark(post, "read", true);
  const act = e.target.dataset.act;
  if (act === "read") mark(post, "read", !post.classList.contains("read"));
  if (act === "saved") mark(post, "saved", !e.target.classList.contains("on"));
});
$("list").addEventListener("auxclick", e => {  // middle-click opens count as read too
  const post = e.target.closest(".post");
  if (post && e.target.matches("a.title")) mark(post, "read", true);
});
$("sources").addEventListener("click", e => {
  const b = e.target.closest(".src");
  if (!b) return;
  state.source = b.dataset.id;
  $("side").classList.remove("open");
  renderSources(); renderPosts();
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  state.filter = t.dataset.f; renderPosts();
});
let timer;
$("q").oninput = e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); renderPosts(); }, 200); };
$("year").onchange = e => { state.year = e.target.value; renderPosts(); };
$("more").onclick = () => renderPosts(true);
$("menu").onclick = () => $("side").classList.toggle("open");
$("markall").onclick = () => {
  const where = state.source ? names[state.source] : "every company";
  if (!confirm(`Mark all posts from ${where} as read?`)) return;
  posts.forEach(p => { if (!state.source || p.s === state.source) read.add(p.u); });
  saveSet("read", read);
  renderSources(); renderPosts();
};

fetch("posts.json", { cache: "no-cache" }).then(r => r.json()).then(data => {
  sources = data.sources;
  sources.forEach(s => names[s.id] = s.name);
  posts = data.posts;
  posts.forEach(p => p._text = `${p.t} ${p.d} ${p.a}`.toLowerCase());
  const years = [...new Set(posts.map(p => (p.p || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  $("year").insertAdjacentHTML("beforeend", years.map(y => `<option>${y}</option>`).join(""));
  $("status").textContent = `Updated ${new Date(data.generated).toLocaleString()}`;
  renderSources(); renderPosts();
}).catch(() => {
  $("status").textContent = "Couldn't load posts.json";
  $("list").innerHTML = '<div class="empty">No posts yet. Run <code>python3 app.py update</code>.</div>';
});
</script>
</body>
</html>
